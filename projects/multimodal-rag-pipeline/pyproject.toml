[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag-pipeline"
version = "1.0.0"
description = "Configurable multimodal PDF retrieval-augmented generation pipeline"
requires-python = ">=3.11,<3.12"
authors = [{name = "GHANMI Helmi"}]
license = "MIT"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "pymupdf>=1.24,<2",
  "tabula-py>=2.9,<3",
  "Pillow>=13,<14",
  "faiss-cpu>=1.8,<2",
  "langchain-text-splitters>=1.1.2,<2",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
ai = [
  "openai>=1.40,<3",
  "sentence-transformers>=6.2,<7",
  "transformers>=5.22,<6",
  "huggingface-hub>=1.31,<3",
]
dev = ["pytest>=8.3,<9", "ruff==0.17.4"]

[project.scripts]
multimodal-rag = "multimodal_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
