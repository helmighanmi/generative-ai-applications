[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pplx-embed"
version = "2.0.0"
description = "Local embedding stack using Perplexity pplx-embed-v1-0.6b with FastAPI and Streamlit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
authors = [{name = "GHANMI Helmi"}]
keywords = ["embeddings", "nlp", "rag", "fastapi", "sentence-transformers", "local-ai"]
dependencies = [
  "sentence-transformers>=5.2,<7",
  "transformers>=4.51,<5",
  "torch>=2.2,<3",
  "numpy>=1.26,<3",
  "huggingface-hub>=0.30,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38,<2", "requests>=2.32,<3", "pandas>=2.2,<3", "plotly>=5.24,<7"]
projector = ["umap-learn>=0.5.6,<1", "scikit-learn>=1.5,<2", "plotly>=5.24,<7"]
dev = [
  "pplx-embed[ui,projector]",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
  "mypy>=1.15,<2",
  "pre-commit>=4,<5",
]

[tool.setuptools.packages.find]
include = ["api*", "streamlit_app*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
