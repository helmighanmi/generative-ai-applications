[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-foundations"
version = "1.0.0"
description = "Isolated LangChain learning and document-loading experiments"
requires-python = ">=3.11,<3.12"
authors = [{name = "GHANMI Helmi"}]
license = "MIT"
dependencies = [
  "langchain>=1.3,<2",
  "langchain-community>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff==0.17.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
