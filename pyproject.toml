[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-ai-applications-engineering"
version = "2.0.0"
description = "Engineering portfolio for production-minded generative AI applications"
requires-python = ">=3.11,<3.12"
authors = [{name = "GHANMI Helmi"}]
license = "MIT"
dependencies = []

[tool.setuptools]
# The repository root is a tooling workspace, not an importable distribution.
packages = []

[project.optional-dependencies]
# Tooling only. Runtime dependencies belong to the project that needs them.
dev = [
  "pytest>=8.3,<10",
  "ruff==0.17.4",
  "mypy>=1.15,<3",
  "pre-commit>=4,<5",
  "pip-audit==2.10.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["projects"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
