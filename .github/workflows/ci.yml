name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install quality tooling
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff==0.17.4' 'pytest>=8.3,<9'
      - name: Compile Python source
        run: python -m compileall -q projects scripts
      - name: Ruff lint
        run: ruff check projects scripts
      - name: Ruff format check
        run: ruff format --check projects scripts
      - name: Markdown link check
        run: python scripts/check_docs_links.py

  project-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: document-parsing
            install: "pip install -e '.[dev]'"
          - project: langchain
            install: "pip install -e '.[dev]'"
          - project: multimodal-rag-pipeline
            install: "pip install -e '.[dev]'"
          - project: pplx-embed-project
            install: "pip install -e '.[dev]'"
          - project: rag-qa-bot-langchain
            install: "pip install -e '.[dev]'"
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install }}
          pip check
      - name: Run tests
        run: python -m pytest -q

  integration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/multimodal-rag-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install pipeline with provider extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[ai,dev]'
          pip check
      - name: Verify the provider stack imports
        run: python -c "import openai, sentence_transformers, torch, transformers"
      - name: Run cross-process integration tests
        run: python -m pytest -q tests/test_pipeline.py

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: multimodal-rag
            context: projects/multimodal-rag-pipeline
            dockerfile: projects/multimodal-rag-pipeline/Dockerfile
          - name: pplx-api
            context: projects/pplx-embed-project
            dockerfile: projects/pplx-embed-project/docker/Dockerfile.api
          - name: pplx-ui
            context: projects/pplx-embed-project
            dockerfile: projects/pplx-embed-project/docker/Dockerfile.streamlit
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.name }}
        run: docker build -t "${{ matrix.name }}" -f "${{ matrix.dockerfile }}" "${{ matrix.context }}"
      - name: Smoke test pplx API with the fake backend
        if: matrix.name == 'pplx-api'
        run: |
          cleanup() { docker stop pplx-api-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --rm --name pplx-api-smoke \
            -e EMBEDDER_BACKEND=fake -p 8000:8000 pplx-api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "API did not become ready"
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:8000/ready
          curl --fail --silent -X POST http://localhost:8000/embed \
            -H 'Content-Type: application/json' \
            -d '{"texts":["hello"]}'
