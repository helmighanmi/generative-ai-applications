name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4

  detect-projects:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: echo "value=$(python3 scripts/project_matrix.py)" >> "$GITHUB_OUTPUT"

  dependency-audit:
    needs: detect-projects
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-projects.outputs.matrix) }}
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Audit resolved dependencies
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          source "$RUNNER_TEMP/audit/bin/activate"
          python -m pip install --upgrade pip setuptools wheel
          pip install 'pip-audit==2.10.1'
          pip install "${{ matrix.audit }}"
          pip check
          pip freeze --exclude "${{ matrix.package }}" > "$RUNNER_TEMP/requirements.txt"
          pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"
