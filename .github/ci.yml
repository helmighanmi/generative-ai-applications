name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install quality tooling
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff>=0.12,<1' 'pytest>=8.3,<9'
      - name: Compile Python source
        run: python -m compileall -q projects scripts
      - name: Ruff lint
        run: ruff check projects scripts
      - name: Ruff format check
        run: ruff format --check projects scripts

  project-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: document-parsing
            install: "pip install -e '.[dev]'"
          - project: langchain
            install: "pip install -e '.[dev]'"
          - project: multimodal-rag-pipeline
            install: "pip install -e '.[dev]'"
          - project: pplx-embed-project
            install: "pip install -e '.[dev]'"
          - project: rag-qa-bot-langchain
            install: "pip install -e '.[dev]'"
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install }}
      - name: Run tests
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: multimodal-rag
            context: projects/multimodal-rag-pipeline
            dockerfile: projects/multimodal-rag-pipeline/Dockerfile
          - name: pplx-api
            context: projects/pplx-embed-project
            dockerfile: projects/pplx-embed-project/docker/Dockerfile.api
          - name: pplx-ui
            context: projects/pplx-embed-project
            dockerfile: projects/pplx-embed-project/docker/Dockerfile.streamlit
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.name }}
        run: docker build -f "${{ matrix.dockerfile }}" "${{ matrix.context }}"
